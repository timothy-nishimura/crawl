services:
  crawler:
    build:
      context: .
      dockerfile: modules/mcp-server/Dockerfile
    ports:
      - "${CRAWLER_PORT:-3001}:3001"
    environment:
      - PORT=3001
      - NODE_ENV=production
      - MCP_API_KEY=${MCP_API_KEY:-}
      - SCRATCH_DIR=/scratch
      - MANIFESTS_DIR=/manifests
      - DATA_DIR=/data
    volumes:
      - crawler-scratch:/scratch
      - crawler-manifests:/manifests
      - crawler-data:/data
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  crawler-scratch:
  crawler-manifests:
  crawler-data:
